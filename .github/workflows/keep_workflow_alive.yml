name: Keep Workflow Alive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Keep Workflow Alive via REST API
      run: |
      
      
    - name: Keep Multiple Workflows Alive
      run: |
        # 1. 定義您的 Workflow 檔案清單（空格隔開）
        WORKFLOW_FILES=("keep_workflow_alive.yml" "full_page_screenshots.yml" "reward_section_screenshot.yml" "screenshot_and_upload.yml")
        
        FAILED=0
    
        # 2. 開始循環執行 API
        for FILE in "${WORKFLOW_FILES[@]}"; do
          echo "--- Processing: $FILE ---"
        
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$FILE/enable")
        
          echo "API Response Code for $FILE: $RESPONSE"
        
          if [ "$RESPONSE" -eq 204 ]; then
            echo "✅ $FILE: Successfully refreshed!"
          else
            echo "❌ $FILE: Failed with status $RESPONSE"
            FAILED=$((FAILED + 1))
          fi
        done
    
        # 3. 如果有任何一個失敗，讓整個 Job 失敗
        if [ "$FAILED" -gt 0 ]; then
          echo "--------------------------------------"
          echo "Total errors encountered: $FAILED"
          exit 1
        else
          echo "--------------------------------------"
          echo "All workflows refreshed successfully!"
        fi
