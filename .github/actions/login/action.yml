name: "Login to ShopBack"
description: "Restore cached Playwright state and run the login script, then save updated state"
inputs:
  account:
    description: "ShopBack account email"
    required: true
  password:
    description: "ShopBack account password"
    required: true

runs:
  using: 'composite'
  steps:
    - name: Restore Playwright state
      uses: actions/cache/restore@v4
      with:
        path: state.json
        key: ${{ runner.os }}-playwright-state-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-playwright-state-

    - name: Run Playwright login
      run: python executor/login.py -a ${{ inputs.account }} -p ${{ inputs.password }}
      shell: bash

    - name: Save Playwright state
      uses: actions/cache/save@v4
      with:
        path: state.json
        key: ${{ runner.os }}-playwright-state-${{ github.run_id }}
